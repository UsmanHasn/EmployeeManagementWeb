<div class="container">
    <div class="row">
        <p class="heading">Notification List</p>
        <!-- app.component.html -->
        <p-table [value]="notificationlist" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,15]" >
            <ng-template pTemplate="header">
                <tr class="tr">
                    <th class="th">#</th>
                    <th class="th">Message</th>
                    <th class="th">Status</th>
                    <th class="th">Created On</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-notification let-rowIndex="rowIndex">

                <tr class="tr">
                    <td class="td">{{rowIndex+1}}</td>
                    <td class="td">{{notification.message}}</td>
                    <td class="td">
                        <p-tag [value]="notification.isSeen ? 'Read' : 'Unread' "
                            [styleClass]="notification.isSeen ? 'p-tag-success' : 'p-tag-danger'"></p-tag>
                    </td>
                    <td class="td">{{moment.utc(notification.createdOn).format('YYYY-MMM-DD HH:mm A')}}</td>

                </tr>
            </ng-template>
        </p-table>
    </div>

</div>
