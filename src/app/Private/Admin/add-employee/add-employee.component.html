<div class="stripe-30 pt-20 cont-sec">
    <div class="container scrollable-form-container">

        <div class="row">
            <form [formGroup]="ValidateForm" class="rounded bg-lightgray shadow p-5 row g-1" style="background-color: lightgray;">
                <h5 style="color: blue; font-weight: bold; font-size: 30px; text-align: left; " class="card-title">Add New Employee </h5>

                <div class="col-12 align-items-center">
                    <div class="col-md-4 mx-auto">
                        <img [src]="apiUrl + profilePic" alt="Avatar Preview" class="mt-2 img-thumbnail"
                            style="width: 200px;height:200px;" onerror="this.src='/assets/Images/noImage.jpg'">
                        <input type="file" class="form-control" id="avatarInput" (change)="onFileChange($event)"
                            accept="image/*">
                    </div>
                </div>

                <!-- First Name and Last Name Inputs -->
                <div class="col-md-6">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" placeholder="First Name" formControlName="firstName">
                        <label for="floatingFirstName">First Name</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" placeholder="Last Name" formControlName="lastName">
                        <label for="floatingLastName">Last Name</label>
                    </div>
                </div>

                <!-- Email Input -->
                <div class="col-12">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" placeholder="name@example.com" formControlName="email">
                        <label for="floatingEmail">Email</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" placeholder="City" formControlName="phoneNo">
                        <label for="floatingCity">Phone #</label>
                    </div>
                </div>

                <!-- Address Inputs -->
                <div class="col-md-6">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" placeholder="1234 Main St" formControlName="address">
                        <label for="floatingAddress">Address</label>
                    </div>
                </div>

                <!-- DorpDown department -->
                 <div class="col-md-6">
                    <div class="form-floating mb-3">
                        <p-dropdown class="dropdown1 form-control form-control-custom" class="form-control" formControlName="departmentId"
                          [options]="departmentDropdown" optionLabel="title" optionValue="id" placeholder="----Select Department----" [style]="{'width.px': 235,}"></p-dropdown>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" placeholder="1234 Main St" formControlName="address">
                        <label for="floatingAddress">Address</label>
                    </div>
                </div>

                <div class="col-md-6" *ngIf="!this.employeeIdentifier">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" placeholder="City" formControlName="password">
                        <label for="floatingCity">Password</label>
                    </div>
                </div>

                <!-- Address Inputs -->
                <div class="col-md-6" *ngIf="!this.employeeIdentifier">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" placeholder="1234 Main St"
                            formControlName="confirmPassword">
                        <label for="floatingAddress">Confirm Password</label>
                    </div>
                </div>

                <!-- Register Button -->
                <div class="col-12">
                    <button class="btn btn-primary btn-lg mt-3 active" type="button"
                        (click)="SaveDate()">{{this.employeeIdentifier? 'Update':'Register'}}</button>
                </div>
            </form>
        </div>
    </div>
</div>
