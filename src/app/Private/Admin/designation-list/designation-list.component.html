<div class="container">
    <div class="row">
        <p class="heading">Designation List</p>
        <!-- app.component.html -->
        <p-table [value]="userviewmodel">
            <ng-template pTemplate="header">
                <tr class="tr">
                    <th class="th">Id</th>
                    <th class="th">Name</th>
                    <th class="th">Joined On</th>
                    <th class="th">Status</th>

                    <th class="th">Action</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-user>
                <tr class="tr">
                    <td class="td">{{user.id}}</td>
                    <td class="td">{{user.firstName}}</td>
                    <td class="td">{{moment.utc(user.createdOn).format('YYYY-MMM-DD HH:mm A')}}</td>

                    <!-- <td class="td">{{user.createdOn}}</td> -->
                    <td class="td">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDefault"
                                [(ngModel)]="user.isActive" (change)="ToggleStatus($event,user.identifier)">
                            <label class="form-check-label" for="flexSwitchCheckDefault">
                                {{ user.isActive ? 'Active' : 'Inactive' }}
                            </label>
                        </div>
                    </td>
                    <td class="td"><p-button class="me-2" severity="danger" icon="pi pi-trash"
                            (click)="MarkUserAsDelete(user.identifier)">
                        </p-button>

                        <!-- <p-button icon="pi pi-pencil"
                            [routerLink]="['/admin/edit-employee', user.identifier]"></p-button> -->

                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

</div>
