<div class="container">
    <div class="row">
        <p class="heading">Attendance</p>
        <!-- app.component.html -->
        <p-table [value]="attendence">
            <ng-template pTemplate="header">
                <tr class="tr">
                    <th class="th">Id</th>
                    <th class="th">Time In</th>
                    <th class="th">Time Out</th>
                    <th class="th">Created On</th>
                    <th class="th">Total Hours</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-attendence>
                <tr class="tr">
                    <td class="td">{{attendence.id}}</td>
                    <td class="td">{{moment.utc(attendence.timedIn).format('YYYY-MMM-DD HH:mm A')}}</td>
                    <td class="td">{{moment.utc(attendence.timeOut).format('YYYY-MMM-DD HH:mm A')}}</td>
                    <td class="td">{{moment.utc(attendence.createdOn).format('YYYY-MMM-DD HH:mm A')}}</td>
                    <td class="td">{{attendence.totalHours}}</td>

                       

                </tr>
            </ng-template>
        </p-table>
    </div>

</div>
