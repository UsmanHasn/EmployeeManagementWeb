<div class="container">
    <div class="row">
        <p class="heading">Leave Requests</p>
        <!-- app.component.html -->
        <p-table [value]="myleaveRequests" [paginator]="true" [rows]="7" [rowsPerPageOptions]="[5,10,15]">
            <ng-template pTemplate="header">
                <tr class="tr">
                    <th class="th">Requested On</th>
                    <th class="th">Leave Type</th>
                    <th class="th">Leave Status</th>
                    <th class="th">Approved By</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-leaveRequest>
                <tr class="tr">
                    <td class="td">{{moment.utc(leaveRequest.createdOn).local().format('YYYY-MMM-DD hh:mm A')}}</td>
                    <td class="td">{{leaveRequest.leaveType}}</td>
                    <td class="td">{{leaveRequest.leaveStatus}}</td>
                    <td class="td">{{leaveRequest.approvedByName}}</td>

                </tr>
            </ng-template>
        </p-table>
    </div>

</div>
